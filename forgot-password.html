<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | AutoFlow</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f7f8fa;
            color: #111827;
            min-height: 100vh;
        }

        .page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 20px;
        }

        .card {
            width: 100%;
            max-width: 440px;
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 18px;
            padding: 40px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.08);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: #111827;
            font-size: 22px;
            font-weight: 800;
            margin-bottom: 32px;
        }

        .logo-mark {
            width: 38px;
            height: 38px;
            background: #111827;
            color: white;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
        }

        .icon {
            width: 56px;
            height: 56px;
            background: #f3f4f6;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            margin-bottom: 22px;
        }

        h1 {
            font-size: 30px;
            margin-bottom: 10px;
        }

        .description {
            color: #6b7280;
            line-height: 1.6;
            margin-bottom: 26px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            height: 50px;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            padding: 0 14px;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #111827;
        }

        .submit-btn {
            width: 100%;
            height: 52px;
            border: none;
            border-radius: 10px;
            background: #111827;
            color: white;
            font-size: 15px;
            font-weight: 800;
            cursor: pointer;
        }

        .submit-btn:hover {
            background: #1f2937;
        }

        .success {
            display: none;
            margin-top: 16px;
            padding: 13px;
            border-radius: 10px;
            background: #ecfdf5;
            color: #047857;
            font-size: 14px;
            line-height: 1.5;
        }

        .back-login {
            display: block;
            text-align: center;
            margin-top: 22px;
            color: #6b7280;
            text-decoration: none;
            font-size: 14px;
        }

        .back-login:hover {
            color: #111827;
        }

        @media (max-width: 520px) {
            .card {
                padding: 28px 22px;
            }

            h1 {
                font-size: 27px;
            }
        }
    </style>
</head>

<body>

    <main class="page">

        <div class="card">

            <a href="index.html" class="logo">
                <div class="logo-mark">A</div>
                AutoFlow
            </a>

            <div class="icon">
                🔑
            </div>

            <h1>Forgot your password?</h1>

            <p class="description">
                Enter your email address and we'll send you instructions
                to reset your password.
            </p>

            <form id="forgotForm">

                <div class="form-group">
                    <label for="email">Email address</label>

                    <input type="email" id="email" placeholder="you@example.com" required>
                </div>

                <button type="submit" class="submit-btn">
                    Send Reset Instructions
                </button>

                <div class="success" id="successMessage">
                    Reset instructions have been sent to your email.
                </div>

            </form>

            <a href="login.html" class="back-login">
                ← Back to Sign In
            </a>

        </div>

    </main>

    <script>
        const forgotForm = document.getElementById("forgotForm");
        const successMessage = document.getElementById("successMessage");

        forgotForm.addEventListener("submit", function (event) {
            event.preventDefault();

            successMessage.style.display = "block";
        });
    </script>

</body>

</html>
